<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지금 파주 — 파주 실시간 인파 지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --bg:#f7f5ef; --ink:#23272f; --ink-2:#55514a; --sub:#6b665b; --hair:#dcd7cb; --hair2:#f0ece1;
    --card:#ffffff; --panel:#fcfaf5; --banner:#fbf9f4; --hover:#faf8f2; --sel-bg:#f6f3ea;
    --s1:#2fa876; --s2:#d9a62e; --s3:#e07b2f; --s4:#d94f3d;
    --t1:#17714b; --t2:#7a5f0e; --t3:#8f4713; --t4:#b03225; --dd:#31648f;
    --bar:#e3ddcf; --demo-bg:#ffffff; --float-bg:#ffffff; --float-bg2:rgba(255,255,255,.88); --pill-bg:rgba(255,255,255,.93);
    --btn-dark:#23272f; --btn-dark-ink:#f2efe6; --btn-dark-hover:#3a404d;
    --tint-hot:#fdf0ec; --tint-cool:#eef7f2; --halo:#ffffff;
    --radius:6px; --radius-lg:10px;
    --shadow-1:0 1px 3px rgba(35,39,47,.10); --shadow-2:0 2px 6px rgba(35,39,47,.25); --shadow-3:0 12px 32px rgba(0,0,0,.28);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:'Pretendard Variable','Pretendard','Malgun Gothic',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;word-break:keep-all}
  .num{font-variant-numeric:tabular-nums}

  header{display:flex;align-items:flex-end;gap:20px;padding:16px 24px;border-bottom:1px solid var(--hair);flex-wrap:wrap;background:var(--bg);position:relative;z-index:1200}
  header .t{display:flex;align-items:center;gap:11px;cursor:pointer;user-select:none}
  header .t:hover b{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
  header .t svg{flex:none}
  header .t b{font-size:28px;display:block;letter-spacing:.5px;font-weight:800;line-height:1.15;white-space:nowrap}
  header .t span{font-size:12.5px;letter-spacing:6.2px;color:var(--sub);margin-top:2px;display:block}
  .tabs{display:flex;padding:3px;border:1.5px solid var(--hair);border-radius:8px;background:var(--float-bg)}
  .tab{display:flex;align-items:center;padding:6px 13px;font-size:13px;color:var(--sub);cursor:pointer;border:0;border-radius:var(--radius);background:transparent;font-family:inherit}
  .tab b{font-size:14px;margin-right:5px}
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--btn-dark-ink);background:var(--btn-dark);font-weight:700}
  .tab.on:hover{color:var(--btn-dark-ink)}
  .legend{margin-left:auto;display:flex;gap:15px;font-size:14px;color:var(--ink);align-items:flex-end;flex-wrap:wrap}
  .legend i{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:-1px}
  .asof{font-size:13px;color:var(--ink);border-left:1px solid var(--hair);padding-left:15px}

  .banner{padding:9px 24px;font-size:14px;border-bottom:1px solid var(--hair);background:var(--banner)}
  .banner b{font-weight:700}

  .wrap{display:grid;grid-template-columns:352px 1fr;height:calc(100vh - 144px);min-height:540px}
  .mapwrap{position:relative}
  #map{position:absolute;inset:0;background:#eee9dd}
  .mapbtns{position:absolute;top:12px;right:12px;z-index:1000;display:flex;gap:6px}
  .mbtn{background:var(--float-bg);border:1px solid var(--hair);border-radius:var(--radius);padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;box-shadow:var(--shadow-1);font-family:inherit}
  .mbtn:hover{background:#f6f3ea}
  .mbtn.tgl{display:flex;align-items:center;gap:6px}
  .mbtn.tgl::before{content:"";width:8px;height:8px;border-radius:50%;background:#cfc9bb;flex:none}
  .mbtn.tgl.on{background:var(--btn-dark);color:var(--btn-dark-ink);border-color:var(--btn-dark)}
  .mbtn.tgl.on:hover{background:var(--btn-dark-hover)}
  .mbtn.tgl.on::before{background:var(--s1)}
  .mbtn[disabled]{opacity:.5;cursor:not-allowed}
  .mbtn[disabled]:hover{background:var(--float-bg)}
  .msel{appearance:none;-webkit-appearance:none;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%2323272f' stroke-width='1.6' fill='none'/></svg>") no-repeat right 10px center;background-color:var(--float-bg);border:1px solid var(--hair);border-radius:var(--radius);padding:7px 28px 7px 12px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;box-shadow:var(--shadow-1);font-family:inherit}
  .maptag{position:absolute;right:12px;bottom:12px;z-index:1000;background:var(--float-bg2);border:1px solid var(--hair);border-radius:var(--radius);padding:5px 10px;font-size:11px;color:var(--sub)}

  /* 지도 노드 */
  .nd{position:relative}
  .nd .core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.3);cursor:pointer;transition:transform .12s}
  .nd:hover .core{transform:translate(-50%,-50%) scale(1.12)}
  .nd .pulse{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;animation:pw 1.7s ease-out infinite;border:2px solid var(--s4)}
  .nd.pulse-gold .pulse{border-color:#d9a62e}
  @keyframes pw{0%{width:18px;height:18px;opacity:.8}100%{width:52px;height:52px;opacity:0}}
  .nd .selring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;border:1.6px dashed var(--ink);pointer-events:none}
  .nd .lb{position:absolute;left:calc(50% + var(--r) + 7px);top:50%;transform:translateY(-50%);white-space:nowrap;font-size:14px;font-weight:700;color:var(--ink);pointer-events:none;
    text-shadow:0 1px 0 var(--halo),0 -1px 0 var(--halo),1px 0 0 var(--halo),-1px 0 0 var(--halo),0 0 6px var(--halo)}
  .nd.west .lb{left:auto;right:calc(50% + var(--r) + 7px);text-align:right}
  .nd.up .lb{left:50%;right:auto;top:auto;bottom:calc(50% + var(--r) + 5px);transform:translateX(-50%);text-align:center}
  .nd .chip{display:block;font-size:11px;font-weight:700;margin-top:1px}
  .z-lo .nd.small .lb{display:none}
  .z-lo .lpill span{display:none}
  .z-lo .lpill{padding:4px 9px}
  .z-lo .lpill b{font-size:12px}
  .llb{font-size:12px;font-weight:600;color:var(--sub);white-space:nowrap;letter-spacing:.6px;pointer-events:none;
    text-shadow:0 1px 0 var(--halo),0 -1px 0 var(--halo),1px 0 0 var(--halo),-1px 0 0 var(--halo)}
  .lpill{width:max-content;background:var(--pill-bg);border:1.5px dashed #a49d90;border-radius:var(--radius);padding:5px 10px;white-space:nowrap;box-shadow:var(--shadow-1);text-align:center;pointer-events:none}
  .lpill b{display:block;font-size:13px;font-weight:800;color:var(--ink-2);letter-spacing:.3px}
  .lpill span{display:block;font-weight:500;font-size:11px;margin-top:2px;color:var(--sub)}
  .clusterbadge{width:max-content;background:var(--btn-dark);color:var(--btn-dark-ink);border-radius:var(--radius);padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap;box-shadow:var(--shadow-2);cursor:pointer}
  .clusterbadge span{opacity:.65;font-weight:400;margin-left:5px}
  .z-hi .clusterbadge{display:none}
  .cam{width:20px;height:20px;background:#23272f;border-radius:6px;border:1.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .cam:hover{background:#3a404d}
  .cam svg{width:11px;height:11px;fill:#fff}
  .cam-hidden .cam{display:none}
  .hide-cam .cam{display:none}
  .trafficbox{position:absolute;left:12px;bottom:12px;z-index:1000;background:var(--float-bg2);border:1px solid var(--hair);border-radius:var(--radius);padding:10px 13px;min-width:195px;display:none;box-shadow:var(--shadow-1)}
  .trafficbox.on{display:block}
  .tb-title{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:6px;display:flex;gap:10px;align-items:baseline}
  .tb-title span{font-weight:400;color:var(--sub);font-size:10.5px;margin-left:auto}
  .tr-row{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:2.5px 0;color:var(--ink)}
  .tr-row i{width:8px;height:8px;border-radius:50%;flex:none}
  .tr-row .sp{margin-left:auto;font-weight:600}
  .tr-row small{font-weight:400;color:var(--sub);margin-left:2px}

  /* 우측 리스트 */
  .list{order:-1;border-right:1px solid var(--hair);background:var(--card);overflow-y:auto;display:flex;flex-direction:column}
  .list-head{padding:13px 18px 11px;border-bottom:1px solid var(--hair);display:flex;align-items:baseline;gap:8px;position:sticky;top:0;background:var(--card);z-index:5}
  .list-head b{font-size:14px}
  .list-head span{font-size:12px;color:var(--sub);margin-left:auto}
  .row{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--hair2);cursor:pointer}
  .row:hover{background:var(--hover)}
  .row.sel{background:var(--sel-bg)}
  .row.tint-hot{background:var(--tint-hot)}
  .row.tint-cool{background:var(--tint-cool)}
  .rk{font-size:12px;color:var(--sub);width:20px;flex:none}
  .info{flex:1;min-width:0}
  .info b{font-size:14px;font-weight:600;display:block;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .info span{font-size:12px;color:var(--sub)}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;white-space:nowrap;flex:none;color:var(--ink)}
  .pill::before{content:"";width:8px;height:8px;border-radius:50%;flex:none}
  .p1::before{background:var(--s1)} .p2::before{background:var(--s2)}
  .p3::before{background:var(--s3)} .p4::before{background:var(--s4)}
  .p3{color:var(--t3)} .p4{color:var(--t4);font-weight:700}
  .p0{color:var(--sub)} .p0::before{background:#b5afa3}
  .dv{font-size:13px;font-weight:600;width:48px;text-align:right;flex:none}
  .du{color:var(--t4)} .dd{color:var(--dd)}

  .det{display:none;padding:14px 18px 18px;border-bottom:1px solid var(--hair2);background:var(--panel)}
  .row.sel + .det{display:block}
  .q{font-size:16px;line-height:1.5;font-weight:800;padding:10px 12px;border-radius:var(--radius);margin-bottom:12px}
  .facts{display:flex;flex-direction:column;gap:7px;margin-bottom:13px}
  .fact{display:flex;justify-content:space-between;font-size:14px;border-bottom:1px solid var(--hair2);padding-bottom:7px}
  .fact:last-child{border-bottom:0}
  .fact span{color:var(--ink)} .fact b{font-weight:600}
  .p-sec{font-size:12px;letter-spacing:1px;color:var(--ink);font-weight:600;margin-bottom:7px}
  .bars{display:flex;align-items:flex-end;gap:2px;height:62px}
  .bars i{flex:1;border-radius:2px 2px 0 0;background:var(--bar);min-height:2px}
  .bars i.now{outline:1.5px solid var(--ink);outline-offset:1px}
  .bar-x{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:5px;margin-bottom:12px}
  .demo-row{display:flex;gap:7px;margin-bottom:13px}
  .demo{flex:1;background:var(--demo-bg);border:1px solid var(--hair);border-radius:var(--radius);padding:8px 10px}
  .demo .lb2{font-size:12px;color:var(--sub)}
  .demo .v{font-size:16px;font-weight:700;margin-top:3px}
  .cams{display:flex;gap:6px;flex-wrap:wrap}
  .cambtn{display:flex;align-items:center;gap:6px;background:var(--btn-dark);color:var(--btn-dark-ink);border:0;border-radius:var(--radius);padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit}
  .cambtn:hover{background:var(--btn-dark-hover)}
  .navs{display:flex;gap:6px;margin-top:13px}
  .navbtn{flex:1;text-align:center;font-size:12.5px;font-weight:600;padding:8px 6px;border:1px solid var(--hair);border-radius:var(--radius);background:var(--card);color:var(--ink);text-decoration:none;white-space:nowrap}
  .navbtn:hover{background:var(--hover)}
  .cambtn svg{width:12px;height:12px;fill:var(--btn-dark-ink)}

  /* CCTV 모달 */
  .modal-bg{position:fixed;inset:0;background:rgba(20,20,24,.45);z-index:2000;display:none;align-items:center;justify-content:center}
  .modal-bg.open{display:flex}
  .modal{width:min(520px,92vw);background:var(--card);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-3)}
  .m-head{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--hair)}
  .m-head b{font-size:14px}
  .m-head span{font-size:12px;color:var(--sub);margin-left:8px}
  .m-x{margin-left:auto;border:0;background:transparent;font-size:17px;cursor:pointer;color:var(--sub);line-height:1;padding:2px 4px}
  .m-x:hover{color:var(--ink)}
  .m-body{position:relative;aspect-ratio:16/10;background:linear-gradient(135deg,#191d26 0%,#232937 55%,#1a1f2b 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  .m-live{position:absolute;top:12px;left:14px;display:flex;align-items:center;gap:6px;color:#fff;font-size:11px;letter-spacing:1.5px}
  .m-live i{width:8px;height:8px;border-radius:50%;background:#ff4d4d;animation:blink 1.4s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
  .m-camname{position:absolute;bottom:12px;right:14px;color:rgba(255,255,255,.75);font-size:11.5px}
  .m-body svg{width:44px;height:44px;fill:#4a5468}
  .m-note{color:#9aa5bd;font-size:12px}
  .m-foot{padding:10px 16px;font-size:11px;color:var(--sub);background:var(--banner)}

  footer{padding:9px 24px;font-size:11px;color:var(--sub);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--hair)}
  @media (prefers-reduced-motion: reduce){
    .nd .pulse,.m-live i{animation:none}
    .nd .core{transition:none}
  }

  @media(max-width:900px){
    .wrap{grid-template-columns:1fr;height:auto}
    .mapwrap{height:440px}
    .list{order:0;border-right:0;border-top:1px solid var(--hair);max-height:480px}
    .legend{margin-left:0}
    .asof{border-left:0;padding-left:0}
  }
</style>
</head>
<body>
<header>
  <div class="t" id="brand" role="button" tabindex="0" title="새로고침">
    <svg width="42" height="42" viewBox="0 0 26 26" aria-hidden="true" style="color:var(--ink)"><circle cx="13" cy="13" r="11" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="13" cy="13" r="6" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".35"/><circle cx="17" cy="9.5" r="3" fill="#2fa876"/></svg>
    <div><b>지금 파주</b><span>NOW PAJU</span></div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab" data-m="I"><b>I</b>피해서 다닐래요</button>
    <button class="tab" data-m="E"><b>E</b>북적여야 신나요</button>
  </div>
  <div class="legend">
    <span><i style="background:var(--s1)"></i>여유</span>
    <span><i style="background:var(--s2)"></i>보통</span>
    <span><i style="background:var(--s3)"></i>약간 혼잡</span>
    <span><i style="background:var(--s4)"></i>혼잡</span>
    <span class="asof num" id="asof">불러오는 중…</span>
  </div>
</header>
<div class="banner" id="banner"></div>

<div class="wrap">
  <div class="mapwrap">
    <div id="map"></div>
    <div class="mapbtns">
      <select class="msel" id="spot-jump"><option value="__all">파주 전체</option></select>
      <button class="mbtn tgl on" id="tg-cam" title="지점 주변 CCTV 위치 표시 (확대하면 나타남)">CCTV</button>
      <button class="mbtn tgl" id="tg-traffic" disabled title="실시간 도로 상황 켜기/끄기">도로 상황</button>
    </div>
    <div class="maptag">지도: OpenStreetMap · CARTO</div>
    <div class="trafficbox" id="trafficbox"></div>
  </div>
  <aside class="list" id="list">
    <div class="list-head"><b>지점 리스트</b><span id="sort-note"></span></div>
    <div id="rows"></div>
  </aside>
</div>

<footer>
  <span>데이터: 경기도 실시간 방문소비 현황지도 (KT 통신 기반) · 5분 주기</span>
  <span>CCTV 연동 예정 (ITS)</span>
</footer>

<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <div class="m-head"><b id="m-title"></b><span id="m-sub"></span><button class="m-x" id="m-x">✕</button></div>
    <div class="m-body" id="m-body">
      <div class="m-live"><i></i>LIVE</div>
      <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
      <div class="m-note">영상을 불러오는 중입니다</div>
      <div class="m-camname" id="m-cam"></div>
    </div>
    <div class="m-foot">국가교통정보센터(ITS) 실시간 도로 CCTV — 영상이 안 나오면 잠시 후 다시 열어보세요</div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>

function inPaju(lat,lng){                                   // 파주 경계 폴리곤 내부 판정 (레이 캐스팅)
  let inside=false;
  for(let i=0,j=PAJU_RING.length-1;i<PAJU_RING.length;j=i++){
    const yi=PAJU_RING[i][0], xi=PAJU_RING[i][1], yj=PAJU_RING[j][0], xj=PAJU_RING[j][1];
    if(((yi>lat)!==(yj>lat)) && (lng < (xj-xi)*(lat-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function nearestCams(s,k){
  return CAMS.map((c,i)=>({i,c,d:Math.pow(c.lat-s.lat,2)+Math.pow((c.lng-s.lng)*0.79,2)})).sort((a,b)=>a.d-b.d).slice(0,k);
}
function thinByRoute(cams){                                 // 같은 노선(고속도로 등) 연속 CCTV는 진입·중간·출구 3개만
  const g={};
  cams.forEach(c=>{
    const m=(c.n||'').match(/^\[([^\]]+)\]/);
    const key=m?m[1].replace(/\s/g,''):('_'+(c.n||''));     // 노선명 없는 시내 CCTV는 개별 유지
    (g[key]=g[key]||[]).push(c);
  });
  const out=[];
  Object.values(g).forEach(a=>{
    if(a.length<=3){ out.push(...a); return; }
    a.sort((x,y)=>(x.lng-y.lng)||(x.lat-y.lat));
    out.push(a[0], a[Math.floor(a.length/2)], a[a.length-1]);
  });
  return out;
}

  const row=document.querySelector(`.row[data-id="${id}"]`);
  if(row) row.scrollIntoView({block:'nearest',behavior:'smooth'});
  if(fly){
    const s=SPOTS.find(x=>x.id===id);
    const z=s.small?13:12;
    map.flyTo([s.lat,s.lng],Math.max(map.getZoom(),z),{duration:.6});
  }
}

// ── CCTV 모달 (HLS 실시간 재생)
const M_BODY=document.getElementById('m-body');
const M_PLACEHOLDER=M_BODY.innerHTML;
let camHls=null;
function stopStream(){
  if(camHls){ try{camHls.destroy();}catch(e){} camHls=null; }
  const v=document.getElementById('cv');
  if(v){ try{v.pause(); v.removeAttribute('src'); v.load();}catch(e){} }
}
function closeModal(){
  document.getElementById('modal-bg').classList.remove('open');
  stopStream();
  M_BODY.innerHTML=M_PLACEHOLDER;
}
function openCam(cam,sub){
  const name=(cam&&cam.n)||'';
  document.getElementById('m-title').textContent=name;
  document.getElementById('m-sub').textContent=sub||'실시간 도로 CCTV';
  stopStream();
  if(cam&&cam.url){
    M_BODY.innerHTML=`<video id="cv" autoplay muted playsinline controls style="width:100%;height:100%;object-fit:contain;background:#000"></video><div class="m-live"><i></i>LIVE</div>`;
    const v=document.getElementById('cv');
    if(window.Hls&&Hls.isSupported()){ camHls=new Hls({maxBufferLength:15}); camHls.loadSource(cam.url); camHls.attachMedia(v); }
    else{ v.src=cam.url; }
  } else {
    M_BODY.innerHTML=M_PLACEHOLDER;
    const mc=document.getElementById('m-cam'); if(mc) mc.textContent=name;
  }
  document.getElementById('modal-bg').classList.add('open');
}
document.getElementById('m-x').onclick=closeModal;
document.getElementById('modal-bg').addEventListener('click',e=>{if(e.target.id==='modal-bg')closeModal();});

// ── 모드 탭
document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab'); if(!b) return;
  mode=b.dataset.m;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.m===mode));
  renderBanner(); renderNodes(); renderList();
});

// ── 실데이터 (Worker 프록시 /api/*)
function fmtDiff(v){ if(v==null||isNaN(v)) return null; const r=Math.round(v); return (r>=0?'+':'')+r+'%'; }
async function fetchDetail(s, rerender=true){
  if(!s.spotId||s.loading) return;
  s.loading=true;
  try{
    const r=await fetch('/api/spot/'+s.spotId); if(!r.ok) throw 0;
    const j=await r.json();
    const tr=j.trend||[];
    if(tr.length){
      const byH=new Array(24).fill(0);
      const max=Math.max(1,...tr.map(x=>Math.max(x.sum,x.avgSum)));
      tr.forEach(x=>{byH[x.h]=Math.round(x.sum/max*100);});
      s.t=byH;
      const last=tr[tr.length-1];
      s.nowIdx=last.h; s.pop=last.sum; s.diff=fmtDiff(last.vsAvg);
      let ph=null,pv=-1; tr.forEach(x=>{if(x.avgSum>pv){pv=x.avgSum;ph=x.h;}});
      s.peak=ph!=null?ph+'시':null;
    }
    if(j.age&&j.age.highestAge) s.age=j.age.highestAge+' '+j.age.highestRatio+'%';
    if(j.sex&&j.sex.highestGender) s.sex=(j.sex.highestGender==='여성'?'여 ':'남 ')+Math.max(j.sex.maleRatio,j.sex.femaleRatio).toFixed(0)+'%';
    s.loaded=true;
  }catch(e){}
  finally{ s.loading=false; if(rerender) renderList(); }
}
async function loadAllDetails(){
  const targets=SPOTS.filter(s=>s.api&&s.spotId&&!s.loaded&&!s.loading);
  await Promise.all(targets.map(s=>fetchDetail(s,false)));
  renderList();
}
async function loadSummary(){
  try{
    const r=await fetch('/api/summary'); if(!r.ok) throw 0;
    const j=await r.json();
    (j.spots||[]).forEach(u=>{
      const s=SPOTS.find(x=>(x.apiName||x.n)===u.name);
      if(s){ if(u.label) s.s=u.label; s.spotId=u.id; if(u.lat!=null){s.lat=u.lat;s.lng=u.lng;} }
    });
    const d=new Date(j.asof);
    document.getElementById('asof').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+' 기준 · 5분 갱신';
    renderBanner(); renderNodes(); renderList();
    loadAllDetails();
  }catch(e){
    document.getElementById('asof').textContent='연결 오류 · 5분 뒤 재시도';
  }
}
async function loadIts(){
  if(!FEATURE_ITS) return;
  try{
    const [c,t]=await Promise.all([fetch('/api/cctv'),fetch('/api/traffic')]);
    if(c.ok){ const j=await c.json(); if(j.cams&&j.cams.length){
      CAMS=j.cams.filter(c2=>inPaju(c2.lat,c2.lng));
      const nearSet=new Set();                               // 지도 핀 = 각 지점에서 2.5km 안 최근접 4개만 (지점 중심 표시)
      SPOTS.forEach(s=>nearestCams(s,4).filter(x=>x.d<=0.000506).forEach(x=>nearSet.add(x.i)));
      CAM_PINS=thinByRoute([...nearSet].map(i=>CAMS[i]));     // 같은 노선 연속분은 3개로 솎음
      renderCams(); renderList();
    } }
    if(t.ok){ const j=await t.json(); if(j.roads&&j.roads.length){ ROADS=j.roads;
      const d=new Date(j.asof); itsAsof=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
      trafficReady(); renderTraffic(); } }
  }catch(e){}
}
setInterval(loadSummary, 300000);
setInterval(loadIts, 300000);

// ── 초기화
document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.m===mode));
map.fitBounds(pajuBounds);
zoomClass();
renderBanner(); renderNodes(); renderCams(); renderList();
loadSummary();
loadIts();
</script>
