<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지금 파주 — 파주 실시간 인파 지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
  :root{
    --bg:#f7f5ef; --ink:#23272f; --ink-2:#55514a; --sub:#6b665b; --hair:#dcd7cb; --hair2:#f0ece1;
    --card:#ffffff; --panel:#fcfaf5; --banner:#fbf9f4; --hover:#faf8f2; --sel-bg:#f6f3ea;
    --s1:#2fa876; --s2:#d9a62e; --s3:#e07b2f; --s4:#d94f3d;
    --t1:#17714b; --t2:#7a5f0e; --t3:#8f4713; --t4:#b03225; --dd:#31648f;
    --bar:#e3ddcf; --demo-bg:#ffffff; --float-bg:#ffffff; --float-bg2:rgba(255,255,255,.88); --pill-bg:rgba(255,255,255,.93);
    --btn-dark:#23272f; --btn-dark-ink:#f2efe6; --btn-dark-hover:#3a404d;
    --tint-hot:#fdf0ec; --tint-cool:#eef7f2; --halo:#ffffff;
    --radius:6px; --radius-lg:10px;
    --shadow-1:0 1px 3px rgba(35,39,47,.10); --shadow-2:0 2px 6px rgba(35,39,47,.25); --shadow-3:0 12px 32px rgba(0,0,0,.28);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:3px}
  body{background:var(--bg);color:var(--ink);font-family:'Pretendard','Malgun Gothic',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;word-break:keep-all}
  @media (min-width:641px){                       /* 창 높이에 딱 맞춰 페이지 스크롤을 없앤다 */
    html,body{height:100%}
    body{display:flex;flex-direction:column;overflow:hidden}
    header,.banner,footer{flex:0 0 auto}
    .wrap{flex:1 1 auto;min-height:0}
    .mapwrap,.list{min-height:0}
  }
  .num{font-variant-numeric:tabular-nums}

  header{display:flex;align-items:flex-end;gap:20px;padding:12px 24px;border-bottom:1px solid var(--hair);flex-wrap:wrap;background:var(--bg);position:relative;z-index:1200}
  header .t{display:flex;align-items:center;gap:11px;cursor:pointer;user-select:none}
  header .t:hover b{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
  header .t svg{flex:none}
  header .t b{font-size:28px;display:block;letter-spacing:.5px;font-weight:800;line-height:32px;white-space:nowrap}
  header .t span{font-size:13px;line-height:16px;font-weight:600;letter-spacing:6px;color:var(--sub);margin-top:2px;display:block}
  .tabs{display:flex;padding:3px;border:1.5px solid var(--hair);border-radius:calc(var(--radius) + 3px);background:var(--float-bg)}
  .tab{display:flex;align-items:center;padding:6px 13px;font-size:13px;line-height:20px;color:var(--sub);cursor:pointer;border:0;border-radius:var(--radius);background:transparent;font-family:inherit}
  .tab b{font-size:14px;margin-right:5px}
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--btn-dark-ink);background:var(--btn-dark);font-weight:700}
  .tab.on:hover{color:var(--btn-dark-ink)}
  .legend{margin-left:auto;display:flex;gap:15px;font-size:14px;line-height:20px;font-weight:500;color:var(--ink);align-items:flex-end;flex-wrap:wrap}
  .legend i{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:-1px}
  .asof{font-weight:600;font-size:13px;color:var(--ink);border-left:1px solid var(--hair);padding-left:15px}

  .banner{padding:7px 24px;font-size:14px;line-height:20px;font-weight:600;border-bottom:1px solid var(--hair);background:var(--banner)}
  .banner b{font-weight:700}

  .wrap{display:grid;grid-template-columns:352px 1fr}
  .mapwrap{position:relative}
  #map{position:absolute;inset:0;background:#eee9dd}
  .mapbtns{position:absolute;top:12px;right:12px;z-index:1000;display:flex;gap:6px}
  .mbtn{background:var(--float-bg);border:1px solid var(--hair);border-radius:var(--radius);padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;box-shadow:var(--shadow-1);font-family:inherit}
  .mbtn:hover{background:#f6f3ea}
  .mbtn.tgl{display:flex;align-items:center;gap:6px}
  .mbtn.tgl::before{content:"";width:8px;height:8px;border-radius:50%;background:#cfc9bb;flex:none}
  .mbtn.tgl.on{background:var(--btn-dark);color:var(--btn-dark-ink);border-color:var(--btn-dark)}
  .mbtn.tgl.on:hover{background:var(--btn-dark-hover)}
  .mbtn.tgl.on::before{background:var(--s1)}
  .mbtn[disabled]{opacity:.5;cursor:not-allowed}
  .mbtn[disabled]:hover{background:var(--float-bg)}
  .msel{appearance:none;-webkit-appearance:none;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%2323272f' stroke-width='1.6' fill='none'/></svg>") no-repeat right 10px center;background-color:var(--float-bg);border:1px solid var(--hair);border-radius:var(--radius);padding:7px 28px 7px 12px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;box-shadow:var(--shadow-1);font-family:inherit}
  .statchip{position:absolute;left:12px;bottom:12px;z-index:1000;display:none;align-items:center;gap:11px;
    background:var(--float-bg);border:1px solid var(--hair);border-radius:var(--radius);padding:7px 12px;
    font-size:13px;color:var(--ink);box-shadow:var(--shadow-1);font-variant-numeric:tabular-nums;white-space:nowrap}
  .statchip.on{display:flex}
  .statchip span{display:flex;align-items:center;gap:5px}
  .statchip i{width:8px;height:8px;border-radius:50%;flex:none}
  .statchip b{font-weight:700}
  .maptag{position:absolute;right:12px;bottom:12px;z-index:1000;background:var(--float-bg2);border:1px solid var(--hair);border-radius:var(--radius);padding:5px 10px;font-size:11px;color:var(--sub)}

  /* 지도 노드 */
  .nd{position:relative}
  .nd .core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.3);cursor:pointer;transition:transform .12s}
  .nd:hover .core{transform:translate(-50%,-50%) scale(1.12)}
  .nd .pulse{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;animation:pw 1.7s ease-out infinite;border:2px solid var(--s4)}
  .nd.pulse-gold .pulse{border-color:#d9a62e}
  @keyframes pw{0%{width:18px;height:18px;opacity:.8}100%{width:52px;height:52px;opacity:0}}
  .nd .selring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;border:1.6px dashed var(--ink);pointer-events:none}
  .nd .lb{position:absolute;right:calc(50% + var(--r) + 7px);top:50%;transform:translateY(-50%);text-align:right;white-space:nowrap;font-size:14px;font-weight:700;color:var(--ink);pointer-events:none;
    text-shadow:0 1px 0 var(--halo),0 -1px 0 var(--halo),1px 0 0 var(--halo),-1px 0 0 var(--halo),0 0 6px var(--halo)}
  .nd.east .lb{right:auto;left:calc(50% + var(--r) + 7px);text-align:left}   /* 왼쪽이 막힌 지점만 오른쪽 */
  .nd.up .lb{left:50%;right:auto;top:auto;bottom:calc(50% + var(--r) + 5px);transform:translateX(-50%);text-align:center}
  .nd .chip{display:block;font-size:11px;font-weight:700;margin-top:1px}
  .z-lo .nd.small .lb{display:none}
  .z-lo .lpill span{display:none}
  .z-lo .lpill{padding:4px 9px}
  .z-lo .lpill b{font-size:12px}
  .llb{font-size:12px;font-weight:600;color:var(--sub);white-space:nowrap;letter-spacing:.6px;pointer-events:none;
    text-shadow:0 1px 0 var(--halo),0 -1px 0 var(--halo),1px 0 0 var(--halo),-1px 0 0 var(--halo)}
  .lpill{width:max-content;background:var(--pill-bg);border:1.5px dashed #a49d90;border-radius:var(--radius);padding:5px 10px;white-space:nowrap;box-shadow:var(--shadow-1);text-align:center;pointer-events:none}
  .lpill b{display:block;font-size:13px;font-weight:800;color:var(--ink-2);letter-spacing:.3px}
  .lpill span{display:block;font-weight:500;font-size:11px;margin-top:2px;color:var(--sub)}
  .clusterbadge{width:max-content;background:var(--btn-dark);color:var(--btn-dark-ink);border-radius:var(--radius);padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap;box-shadow:var(--shadow-2);cursor:pointer}
  .clusterbadge span{opacity:.65;font-weight:400;margin-left:5px}
  .z-hi .clusterbadge{display:none}
  .cam{width:20px;height:20px;background:var(--btn-dark);border-radius:var(--radius);border:1.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .cam:hover{background:#3a404d}
  .cam svg{width:13px;height:13px;color:#fff}
  .cam-hidden .cam{display:none}
  .hide-cam .cam{display:none}
  .trafficbox{position:absolute;left:12px;bottom:12px;z-index:1000;background:var(--float-bg2);border:1px solid var(--hair);border-radius:var(--radius);padding:10px 13px;min-width:195px;display:none;box-shadow:var(--shadow-1)}
  .trafficbox.on{display:block}
  .tb-title{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px;display:flex;gap:10px;align-items:baseline}
  .tb-title span{font-weight:400;color:var(--sub);font-size:11px;margin-left:auto}
  .tr-row{display:flex;align-items:center;gap:7px;font-size:13px;padding:2.5px 0;color:var(--ink)}
  .tr-row i{width:8px;height:8px;border-radius:50%;flex:none}
  .tr-row .sp{margin-left:auto;font-weight:600}
  .tr-row small{font-weight:400;color:var(--sub);margin-left:2px}
  .spdchip{transform:translate(-50%,-50%);width:max-content;background:var(--float-bg);border:2px solid;border-radius:var(--radius);padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap;box-shadow:var(--shadow-1);font-variant-numeric:tabular-nums}
  .spdchip b{font-weight:800;margin-right:4px}
  .spdchip small{font-weight:400;opacity:.75;margin-left:1px}

  /* 우측 리스트 */
  .list{order:-1;border-right:1px solid var(--hair);background:var(--card);overflow-y:auto;display:flex;flex-direction:column}
  #rows{padding-bottom:18px}
  @media (max-width:640px){ #rows{padding-top:0!important} }
  .list-head{padding:10px 18px 9px;border-bottom:1px solid var(--hair);display:flex;align-items:baseline;gap:8px;position:sticky;top:0;background:var(--card);z-index:5}
  .list-head b{font-size:14px;line-height:20px}
  .list-head span{font-size:12px;line-height:18px;font-weight:600;color:var(--ink);margin-left:auto}
  .row{display:flex;align-items:center;gap:10px;padding:8px 18px;border-bottom:1px solid var(--hair2);cursor:pointer;
    height:var(--rowh,60px);box-sizing:border-box}
  .row:hover{background:var(--hover)}
  .row.sel{background:var(--sel-bg)}
  .row.tint-hot{background:var(--tint-hot)}
  .row.tint-cool{background:var(--tint-cool)}
  .rk{font-size:12px;line-height:19px;font-weight:600;color:var(--ink);width:20px;flex:none}
  .info{flex:1;min-width:0}
  .info b{font-size:14px;font-weight:600;display:block;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .info span{font-size:12px;line-height:16px;display:block;font-weight:600;color:var(--ink)}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;line-height:19px;font-weight:600;white-space:nowrap;flex:none;color:var(--ink)}
  .pill::before{content:"";width:8px;height:8px;border-radius:50%;flex:none}
  .p1::before{background:var(--s1)} .p2::before{background:var(--s2)}
  .p3::before{background:var(--s3)} .p4::before{background:var(--s4)}
  .p3{color:var(--t3)} .p4{color:var(--t4);font-weight:700}
  .p0{color:var(--sub)} .p0::before{background:#b5afa3}
  .dv{font-size:13px;line-height:19px;font-weight:600;width:48px;text-align:right;flex:none}
  .du{color:var(--t4)} .dd{color:var(--dd)}

  .det{display:none;font-weight:600;padding:10px 18px 8px;border-bottom:1px solid var(--hair2);background:var(--panel)}
  .row.sel + .det{display:block}
  .headline{font-size:15px;font-weight:700;line-height:22px;display:flex;gap:9px;align-items:stretch;margin-bottom:10px}
  .headline::before{content:'';width:3px;border-radius:2px;background:currentColor;flex:0 0 3px}
  .p-sec{display:flex;align-items:center;gap:8px;font-size:12px;line-height:18px;letter-spacing:.6px;color:var(--ink);font-weight:600;margin:9px 0 5px}
  .p-sec::after{content:'';height:1px;background:var(--hair2);flex:1;order:1}
  .p-sec .hint{order:2;font-weight:600;letter-spacing:0}
  /* 핵심 지표 4개 — 값의 자리와 크기를 맞춰 훑기 좋게(추정 인구만 강조) */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .mcard{background:var(--card);border:1px solid var(--hair);border-radius:var(--radius);padding:7px 10px;min-width:0;text-align:center}
  .mcard .lb{font-size:12px;line-height:16px;font-weight:600;color:var(--ink);margin-bottom:2px}
  .mcard .v{font-size:19px;font-weight:800;letter-spacing:-.4px;line-height:22px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mcard .v small{font-size:12px;font-weight:600;color:var(--ink);margin-left:2px}
  .mcard.acc{background:color-mix(in srgb, var(--c) 7%, var(--card));
    border-color:color-mix(in srgb, var(--c) 32%, var(--hair))}
  .mcard.acc .v{color:var(--c)}                   /* 등급색과 같은 색 — 강조색은 하나만 */
  .bars{display:flex;align-items:flex-end;gap:2px;height:46px;margin-top:13px}
  .bars i{flex:1;border-radius:2px 2px 0 0;background:#ece7db;min-height:2px;position:relative}
  .bars i.now::after{content:'';position:absolute;left:50%;top:-7px;width:5px;height:5px;border-radius:50%;
    background:currentColor;transform:translateX(-50%)}
  .bars i.mark{background:#c9c1ae}
  .bars i b{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:5px;font-size:11px;line-height:14px;
    font-style:normal;font-weight:700;color:var(--ink);white-space:nowrap}
  .bars i.s b{left:0;transform:none} .bars i.e b{left:auto;right:0;transform:none}
  .bar-x{display:flex;justify-content:space-between;font-size:12px;line-height:16px;font-weight:600;color:var(--ink);margin-top:4px}
  .kv{font-size:13px;line-height:19px;font-weight:600;color:var(--ink);margin-top:6px;text-align:right}
  .kv b{font-weight:700}
  .wx{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--hair);
    border-radius:var(--radius);padding:7px 12px;margin-top:9px}
  .wx .ic{display:flex;align-items:center;flex:0 0 auto}
  .wx .main{min-width:0}
  .wx .t{display:block;font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:26px}
  .wx .cond{font-size:12px;line-height:18px;font-weight:600;color:var(--ink)}
  .wx .r{margin-left:auto;display:grid;grid-template-columns:repeat(7,auto);row-gap:2px;
    font-size:12px;font-weight:600;color:var(--ink);line-height:19px;white-space:nowrap}
  .wx .r b{font-weight:600;padding-right:5px}     /* 항목 이름 — 왼쪽 맞춤 */
  .wx .r span{text-align:right}                   /* 숫자만 오른쪽 맞춤(단위는 별도 칸) */
  .wx .r em{font-style:normal;text-align:left;padding-right:5px}
  .wx .r i{font-style:normal;padding:0 3px}       /* 가운데 구분자 */
  .wx .near{color:var(--ink)}
  .cams{display:flex;flex-direction:column;border:1px solid var(--hair);border-radius:var(--radius);background:var(--card);overflow:hidden}
  .cambtn{display:flex;align-items:center;gap:8px;width:100%;line-height:19px;font-weight:600;text-align:left;background:transparent;color:var(--ink);
    border:0;border-bottom:1px solid var(--hair2);padding:6px 11px;font-size:13px;cursor:pointer;font-family:inherit}
  .cambtn:last-child{border-bottom:0}
  .cambtn:hover{background:var(--hover)}
  .cambtn .tag{flex:0 0 90px;text-align:center;font-size:12px;line-height:15px;font-weight:600;color:var(--ink);border:1px solid var(--hair);border-radius:3px;padding:1px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cambtn .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cambtn .go{margin-left:auto;color:var(--ink);font-size:12px;font-weight:600}
  .navs{display:flex;gap:6px;margin-top:0}
  .navbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;line-height:19px;font-weight:600;
    padding:7px 6px;border:1px solid var(--hair);border-radius:var(--radius);background:var(--card);color:var(--ink);
    text-decoration:none;white-space:nowrap}
  .navbtn:hover{background:var(--hover)}
  .navbtn::before{content:'';width:6px;height:6px;border-radius:50%;flex:0 0 6px}   /* 브랜드 색은 점으로만 */
  .navbtn.kakao::before{background:#f2c200} .navbtn.naver::before{background:#2fa876} .navbtn.tmap::before{background:#8a7fd6}

  /* CCTV 모달 */
  .modal-bg{position:fixed;inset:0;background:rgba(20,20,24,.45);z-index:2000;display:none;align-items:center;justify-content:center}
  .modal-bg.open{display:flex}
  .modal{width:min(520px,92vw);background:var(--card);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-3)}
  .m-head{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--hair)}
  .m-head b{font-size:14px}
  .m-head span{font-size:12px;color:var(--sub);margin-left:8px}
  .m-x{margin-left:auto;display:flex;align-items:center;border:0;background:transparent;cursor:pointer;color:var(--ink);padding:4px}
  .m-x:hover{color:var(--ink)}
  .m-body{position:relative;aspect-ratio:16/10;background:linear-gradient(135deg,#191d26 0%,#232937 55%,#1a1f2b 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  .m-src{position:absolute;left:14px;bottom:12px;color:#fff;font-size:11px;font-weight:600;letter-spacing:.2px;
    text-shadow:0 1px 3px rgba(0,0,0,.9);pointer-events:none}
  .m-live{position:absolute;top:12px;left:14px;display:flex;align-items:center;gap:6px;color:#fff;font-size:11px;letter-spacing:1.5px}
  .m-live i{width:8px;height:8px;border-radius:50%;background:#ff4d4d;animation:blink 1.4s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
  .m-camname{position:absolute;bottom:12px;right:14px;color:rgba(255,255,255,.75);font-size:12px}
  .m-body svg{width:44px;height:44px;fill:#4a5468}
  .m-note{color:#9aa5bd;font-size:12px}
  .m-foot{padding:10px 16px;font-size:11px;color:var(--sub);background:var(--banner)}

  footer{padding:7px 12px 7px 24px;font-size:12px;font-weight:600;color:var(--sub);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--hair)}
  #visits{font-size:12px;font-weight:600}                        /* 지도 출처 표기 오른쪽 끝과 맞춘다 */
  @media (prefers-reduced-motion: reduce){
    .nd .pulse,.m-live i{animation:none}
    .nd .core{transition:none}
  }

  @media(max-width:900px){
    .wrap{grid-template-columns:1fr;height:auto}
    .mapwrap{height:440px}
    .list{order:0;border-right:0;border-top:1px solid var(--hair);max-height:480px}
    .legend{margin-left:0}
    .asof{border-left:0;padding-left:0}
  }

  /* ── 모바일 ── */
  @media(max-width:600px){
    header{gap:10px 12px;padding:11px 14px}
    header .t{gap:9px}
    header .t svg{width:33px;height:33px}
    header .t b{font-size:21px}
    header .t span{font-size:10px;letter-spacing:4px}
    .legend{margin-left:auto;gap:0}
    .legend>span:not(.asof){display:none}       /* 색 설명은 리스트 배지로 충분 */
    .asof{border-left:0;padding-left:0;font-size:12px}
    .tabs{order:3;width:100%}
    .tab{flex:1;justify-content:center;padding:12px 6px;min-height:44px;font-size:13px}

function feelsLike(t,rh,windMs){
  if(t==null) return null;
  if(rh!=null&&t>=20){
    const tw=t*Math.atan(0.151977*Math.pow(rh+8.313659,0.5))+Math.atan(t+rh)-Math.atan(rh-1.676331)
      +0.00391838*Math.pow(rh,1.5)*Math.atan(0.023101*rh)-4.686035;
    return Math.round(-0.2442+0.55399*tw+0.45535*t-0.0022*tw*tw+0.00278*tw*t+3.0);
  }
  const v=(windMs||0)*3.6;
  if(t<=10&&v>4.8) return Math.round(13.12+0.6215*t-11.37*Math.pow(v,0.16)+0.3965*t*Math.pow(v,0.16));
  return Math.round(t);
}

function inPaju(lat,lng){                                   // 파주 경계 폴리곤 내부 판정 (레이 캐스팅)
  let inside=false;
  for(let i=0,j=PAJU_RING.length-1;i<PAJU_RING.length;j=i++){
    const yi=PAJU_RING[i][0], xi=PAJU_RING[i][1], yj=PAJU_RING[j][0], xj=PAJU_RING[j][1];
    if(((yi>lat)!==(yj>lat)) && (lng < (xj-xi)*(lat-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function nearestCams(s,k){
  return CAMS.map((c,i)=>({i,c,d:Math.pow(c.lat-s.lat,2)+Math.pow((c.lng-s.lng)*0.79,2)})).sort((a,b)=>a.d-b.d).slice(0,k);
}
function thinByRoute(cams){                                 // 같은 노선(고속도로 등) 연속 CCTV는 진입·중간·출구 3개만
  const g={};
  cams.forEach(c=>{
    const m=(c.n||'').match(/^\[([^\]]+)\]/);
    const key=m?m[1].replace(/\s/g,''):('_'+(c.n||''));     // 노선명 없는 시내 CCTV는 개별 유지
    (g[key]=g[key]||[]).push(c);
  });
  const out=[];
  Object.values(g).forEach(a=>{
    if(a.length<=3){ out.push(...a); return; }
    a.sort((x,y)=>(x.lng-y.lng)||(x.lat-y.lat));
    out.push(a[0], a[Math.floor(a.length/2)], a[a.length-1]);
  });
  return out;
}

const LVC={'원활':'#2fa876','서행':'#e07b2f','정체':'#d94f3d'};

// 도로 선형은 배경지도와 같은 출처(OSM)를 쓰고, ITS 실측 속도는 미리 만든 링크 매핑으로 얹는다
let ROADGEO=[], LINKMAP={}, ROADSIB={}, linkLayer=L.layerGroup();
const spdColor=v=>v>=60?LVC['원활']:(v>=35?LVC['서행']:LVC['정체']);
const mixWhite=(hex,t)=>{ const n=parseInt(hex.slice(1),16), m=x=>Math.round(x+(255-x)*t);
  return `rgb(${m((n>>16)&255)},${m((n>>8)&255)},${m(n&255)})`; };   // 추정 구간은 같은 색을 옅게
async function loadLinks(){
  if(ROADGEO.length) return;
  try{
    const j=await (await fetch('/paju_roads.json')).json();
    ROADGEO=j.roads||[]; LINKMAP=j.map||{}; ROADSIB=j.sib||{};
  }catch(e){ ROADGEO=[]; }
}
// 파일에 이미 '지점 반경 3km 이내' 링크만 담겨 있다.
// 실측 속도가 없는 구간은 같은 도로의 평균으로 이어 그려 끊김을 없앤다(연하게 = 추정).
// 줌에 따라 보여줄 도로 등급과 선 굵기 (축소 시 간선만 남겨 뭉침 방지)
function trafficStyleForZoom(){
  const z=map.getZoom();
  // 멀리서 볼수록 선을 가늘게, 그리고 왕복 분리도로는 한 줄만 그린다.
  //   두 줄이 몇 픽셀 간격으로 붙으면 한 덩어리로 뭉쳐 보이기 때문.
  if(z<11.5) return {maxClass:1, weight:2.5, single:true};   // 고속·국도만
  if(z<12.5) return {maxClass:2, weight:2.8, single:true};   // + 주요 간선
  if(z<13.5) return {maxClass:3, weight:3,   single:true};   // + 보조 간선
  if(z<14.5) return {maxClass:4, weight:3.5, single:true};   // + 지방도
  if(z<15.5) return {maxClass:5, weight:4.5, single:false};  // 전체
  return {maxClass:5, weight:5, single:false};
}

// 도로별 색(속도) 계산 — 화면 이동과 무관하므로 소통 데이터가 바뀔 때만 다시 계산한다
function computeColors(speeds){
  const roadAvg=Object.assign({},ROAD_AVG);
  ROADS.forEach(r=>{ if(roadAvg[r.road]==null) roadAvg[r.road]=r.speed; });

  const measured={};                                       // OSM 도로별 실측 속도 평균
  for(const [linkId,ri] of Object.entries(LINKMAP)){
    const v=speeds[linkId];
    if(v==null) continue;
    (measured[ri]=measured[ri]||[]).push(v);
  }
  Object.keys(measured).slice().forEach(ri=>{              // 왕복 분리도로는 반대편 차로도 같이 칠한다
    (ROADSIB[ri]||[]).forEach(s=>{ if(!measured[s]) measured[s]=measured[ri].slice(); });
  });
  // 교차로 조각 메우기: 색이 없는 짧은 구간이라도 양 끝이 색칠 도로에 붙어 있으면 이웃 속도를 물려받는다
  const val=i=>{ const a=measured[i]; return a?Math.round(a.reduce((x,y)=>x+y,0)/a.length):(roadAvg[ROADGEO[i].n]??null); };
  if(!ROADGEO._fill){                                      // 끝점 색인 (회전교차로는 모든 점을 넣어 진입로와 만나게)
    const k=p=>p[0].toFixed(5)+','+p[1].toFixed(5), em={};
    ROADGEO.forEach((r,i)=>{
      const pts=r.rb?r.p:[r.p[0],r.p[r.p.length-1]];
      pts.forEach(p=>{ (em[k(p)]=em[k(p)]||[]).push(i); });
    });
    ROADGEO._fill=em;
  }
  const kf=p=>p[0].toFixed(5)+','+p[1].toFixed(5);
  const roadLen=p=>{ let s=0; for(let i=0;i<p.length-1;i++) s+=Math.hypot((p[i+1][0]-p[i][0])*111320,(p[i+1][1]-p[i][1])*88000); return s; };
  const dirAt=(p,atStart)=>{ const a=atStart?p[0]:p[p.length-1], b=atStart?p[1]:p[p.length-2];
    return (Math.atan2((b[1]-a[1])*Math.cos(a[0]*Math.PI/180),b[0]-a[0])*180/Math.PI+360)%360; };
  const angGap=(a,b)=>{ const d=Math.abs(a-b)%360; return Math.min(d,360-d); };
  const inherit={};
  const cur=i=>{ const v=val(i); return v!=null?v:(inherit[i]??null); };
  for(let round=0;round<3;round++){                         // 나들목 램프는 여러 조각이라 여러 번 물려줘야 다 이어진다
    const add={};
    ROADGEO.forEach((r,i)=>{
      if(cur(i)!=null) return;
      const nb=[];
      if(r.rb){                                            // 회전교차로: 원형이라 모든 점에서 진입로를 찾는다
        r.p.forEach(p=>(ROADGEO._fill[kf(p)]||[]).forEach(j=>{ if(j!==i){const v=cur(j); if(v!=null) nb.push(v);} }));
        if(nb.length) add[i]=Math.round(nb.reduce((a,b)=>a+b,0)/nb.length);
        return;
      }
      const len=roadLen(r.p);
      if(!r.lk&&len>800) return;                           // 램프는 길이 제한 없이, 그 외는 800m 이하만
      const line=[];                                       // 곧게 이어지거나 같은 도로명인 이웃 — 이쪽 색을 우선한다
      [0,1].forEach(e=>{
        const at=e===0, p=at?r.p[0]:r.p[r.p.length-1], mine=dirAt(r.p,at);
        (ROADGEO._fill[kf(p)]||[]).forEach(j=>{
          if(j===i) return;
          const v=cur(j); if(v==null) return;
          nb.push(v);
          const jp=ROADGEO[j].p, js=kf(jp[0])===kf(p);
          if(angGap(mine,(dirAt(jp,js)+180)%360)<=50||(r.n&&ROADGEO[j].n===r.n)) line.push(v);
        });
      });
      const use=line.length?line:nb;                       // 교차하는 다른 도로 색이 섞이지 않게
      if(nb.length>=(r.lk||line.length?1:2)&&(len<=300||r.lk||line.length))
        add[i]=Math.round(use.reduce((a,b)=>a+b,0)/use.length);
    });
    const keys=Object.keys(add);
    if(!keys.length) break;
    keys.forEach(i=>inherit[i]=add[i]);
  }
  // 이어짐 마무리 — 끝점이 1m쯤 어긋나 매칭이 빗나간 구간은 30m 안에서 방향이 맞는 색을 잇는다
  const EG=0.0003, ek=(a,b)=>Math.round(a/EG)+','+Math.round(b/EG);
  for(let round=0;round<3;round++){                         // 방금 이어 붙인 구간이 다음 구간의 근거가 된다
    const eg={};
    ROADGEO.forEach((r,i)=>{ if(cur(i)==null) return;
      [true,false].forEach(at=>{ const p=at?r.p[0]:r.p[r.p.length-1];
        (eg[ek(p[0],p[1])]=eg[ek(p[0],p[1])]||[]).push([p,dirAt(r.p,at),cur(i),r.n]); }); });
    const add={};
    ROADGEO.forEach((r,i)=>{
      if(cur(i)!=null||r.lk) return;
      const nb=[];
      [true,false].forEach(at=>{
        const p=at?r.p[0]:r.p[r.p.length-1], mine=dirAt(r.p,at);
        const cy=Math.round(p[0]/EG), cx=Math.round(p[1]/EG);
        for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++) (eg[(cy+dy)+','+(cx+dx)]||[]).forEach(([q,d,v,n])=>{
          if(Math.hypot((q[0]-p[0])*111320,(q[1]-p[1])*88000)>30) return;
          if(angGap(mine,(d+180)%360)<=50||(r.n&&n===r.n)) nb.push(v);
        });
      });
      if(nb.length) add[i]=Math.round(nb.reduce((a,b)=>a+b,0)/nb.length);
    });
    const keys=Object.keys(add);
    if(!keys.length) break;
    keys.forEach(i=>inherit[i]=add[i]);
  }
  // 램프 마무리 — 나들목 조각은 양 끝에서 가장 가까이 맞닿은 도로 색을 각각 받아, 반씩 나눠 칠한다.
  //   한쪽 색으로만 칠하면 본선 색과 부딪혀 보이므로 양쪽을 이어 주는 셈.
  const split={};
  const ramps=[];
  ROADGEO.forEach((r,i)=>{ if(r.lk&&val(i)==null) ramps.push(i); });
  if(ramps.length){
    const GC=0.0006, gk=(a,b)=>Math.round(a/GC)+','+Math.round(b/GC), gm={};
    ROADGEO.forEach((r,i)=>{ if(r.lk) return; const v=cur(i); if(v==null) return;
      r.p.forEach(p=>{ (gm[gk(p[0],p[1])]=gm[gk(p[0],p[1])]||[]).push([p,v]); }); });
    const nearest=p=>{
      let best=null, bd=80, cy=Math.round(p[0]/GC), cx=Math.round(p[1]/GC);
      for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++) (gm[(cy+dy)+','+(cx+dx)]||[]).forEach(([q,v])=>{
        const d=Math.hypot((q[0]-p[0])*111320,(q[1]-p[1])*88000);
        if(d<bd){ bd=d; best=v; }
      });
      return best;
    };
    ramps.forEach(i=>{
      const p=ROADGEO[i].p, a=nearest(p[0]), b=nearest(p[p.length-1]);
      if(a!=null&&b!=null&&spdColor(a)!==spdColor(b)) split[i]={a,b};
      else if(a!=null||b!=null) inherit[i]=(a!=null&&b!=null)?Math.round((a+b)/2):(a??b);
    });
  }
  return {measured,inherit,roadAvg,split};
}

function drawLinks(speeds){
  linkLayer.clearLayers();
  if(!showTraffic||!ROADGEO.length) return;
  const st=trafficStyleForZoom();
  if(ROADGEO._for!==speeds){ ROADGEO._col=computeColors(speeds); ROADGEO._for=speeds; }
  const {measured,inherit,roadAvg,split}=ROADGEO._col;

  const vb=map.getBounds().pad(0.25);                      // 화면 밖 도로는 그리지 않는다(성능)
  const vN=vb.getNorth(), vS=vb.getSouth(), vE=vb.getEast(), vW=vb.getWest();
  const hasColor=i=>measured[i]!=null||roadAvg[ROADGEO[i].n]!=null||inherit[i]!=null||split[i]!=null;
  const est={}, real={};                                   // 색깔별로 한 줄기로 묶는다 — 겹쳐도 진해지지 않게
  ROADGEO.forEach((r,i)=>{
    if(r.p.length<2) return;
    if((r.h||5)>st.maxClass) return;                       // 현재 줌에서 안 보일 등급
    // 왕복 짝 중 한 줄만 — 단, 남길 쪽에 색이 있을 때만 건너뛴다(색 없는 쪽만 남으면 구간이 통째로 빈다)
    if(st.single&&(ROADSIB[i]||[]).some(j=>j<i&&hasColor(j))) return;
    let vis=false;
    for(const p of r.p){ if(p[0]>=vS&&p[0]<=vN&&p[1]>=vW&&p[1]<=vE){ vis=true; break; } }
    if(!vis) return;
    const arr=measured[i];
    const own=arr?Math.round(arr.reduce((a,b)=>a+b,0)/arr.length):null;
    if(own==null&&split[i]){                               // 램프: 앞뒤 절반을 각 끝 색으로 이어 준다
      const m=Math.max(1,Math.floor(r.p.length/2)), s=split[i];
      const ca=spdColor(s.a), cb=spdColor(s.b);
      (est[ca]=est[ca]||[]).push(r.p.slice(0,m+1));
      (est[cb]=est[cb]||[]).push(r.p.slice(m));
      return;
    }
    const v=(own!=null)?own:(roadAvg[r.n]??inherit[i]);
    if(v==null) return;
    const g=(own!=null)?real:est, c=spdColor(v);
    (g[c]=g[c]||[]).push(r.p);
  });
  const paint=(g,w,light)=>Object.keys(g).forEach(c=>                 // 추정 구간을 먼저 깔고 실측을 위에 얹는다
    L.polyline(g[c],{color:light?mixWhite(c,.42):c,weight:w,opacity:1,
      lineCap:'round',lineJoin:'round',interactive:false}).addTo(linkLayer));
  paint(est,Math.max(2,st.weight-0.5),true);
  paint(real,st.weight,false);
  if(!map.hasLayer(linkLayer)) linkLayer.addTo(map);
}

const ROWS_VISIBLE=10;
function fitRows(){
  const list=document.getElementById('list');
  if(!list||innerWidth<=640){ document.documentElement.style.removeProperty('--rowh'); return; }
  const head=list.querySelector('.list-head');
  const avail=list.clientHeight-(head?head.offsetHeight:0);
  if(avail<=0) return;
  let n=ROWS_VISIBLE, h=Math.floor(avail/n);
  if(h>84){ n=Math.ceil(avail/84); h=Math.floor(avail/n); }          // 큰 화면은 개수를 늘려 여백을 없앤다
  if(h<48){ n=Math.max(4,Math.floor(avail/48)); h=Math.floor(avail/n); }
  document.documentElement.style.setProperty('--rowh',h+'px');
  const rows=document.getElementById('rows');                        // 남는 몇 px 때문에 다음 행이 살짝 보이던 것 제거
  if(rows) rows.style.paddingTop=Math.max(0,avail-h*n)+'px';
}

// ── 리스트
// 정렬 점수 — 등급이 주 기준이고, 같은 등급 안에서 모드에 따라 다른 잣대를 쓴다.
//   E(붐빔 찾기)는 실제 사람 수, I(피하기)는 평시 대비 증감.
//   같은 '여유'라도 240명 공원(+22%)보다 7,078명 역이 붐비는 곳이므로 E는 절대 인원으로 본다.
function crowdScore(s){
  const r=RANK[s.s]??0;
  if(mode==='E'){
    const p=s.pop!=null?s.pop:-1;
    return r*1e9 + p;
  }
  const d=s.diff!=null?parseFloat(s.diff):NaN;
  return r*10000 + (isNaN(d)?0:d);
}
function sorted(){
  return [...SPOTS].sort((a,b)=>{
    const an=(RANK[a.s]??0)<=0, bn=(RANK[b.s]??0)<=0;      // 관측 준비·집계중은 항상 맨 아래
    if(an!==bn) return an?1:-1;
    if(an&&bn) return a.n.localeCompare(b.n,'ko');
    const sa=crowdScore(a), sb=crowdScore(b);
    return mode==='E' ? sb-sa : sa-sb;                      // E=붐빔 순, I=한산 순
  });
}

    }

        <span class="cond" title="기온·습도·바람을 반영한 체감온도">${skyText(wx.w.code)}${feel!=null?` · 체감 ${feel}°`:''}</span></div>
      <div class="r num"><b>최저</b><span>${wx.w.lo}</span><em>°</em><i>/</i><b>최고</b><span>${wx.w.hi}</span><em>°</em>

    if(!s.api){
      det=`<div class="headline" style="color:var(--sub)"><span>${MSG[mode][s.s]}</span></div>
      <div style="font-size:13px;color:var(--ink);line-height:20px">경기도 관측망에 아직 없는 지점이라 혼잡도는 제공되지 않습니다. 날씨·위치·주변 CCTV만 표시합니다.</div>
      ${wxRow}${camSec}${navSec}`;
    } else if(!s.loaded){
      det=`<div class="headline" style="color:${TXTC[s.s]}"><span>${MSG[mode][s.s]}</span></div>
      <div style="font-size:13px;color:var(--ink)">상세 데이터를 불러오는 중입니다…</div>${camSec}${navSec}`;
    } else {
      // E는 피크 시각을, I는 남은 시간 중 가장 한산한 시각을 막대에 직접 표시한다
      const hi=s.t.reduce((b,v,j)=>v>s.t[b]?j:b,0);
      let lo=null;
      for(let j=s.nowIdx;j<24;j++){ if(s.t[j]>0&&(lo===null||s.t[j]<s.t[lo])) lo=j; }
      if(lo===null) lo=s.t.reduce((b,v,j)=>(v>0&&v<s.t[b])?j:b,hi);
      const mk = mode==='E' ? hi : lo, mkTxt = mode==='E' ? `붐빔 ${hi}시` : `한산 ${lo}시`;
      const bars=s.t.map((v,j)=>{
        const isNow=j===s.nowIdx, isMk=j===mk;
        const cls=(isNow?'now ':'')+(isMk&&!isNow?'mark ':'')+(isMk?(j<=1?'s':(j>=22?'e':'')):'');
        const st=`height:${Math.max(3,Math.round(v*0.46))}px`+(isNow?`;color:${HEXC[s.s]};background:${HEXC[s.s]}`:'');
        return `<i class="${cls.trim()}" style="${st}">${isMk?`<b>${mkTxt}</b>`:''}</i>`;
      }).join('');
      const rec = mode==='E' ? (rk>=4?'지금 바로!':(rk===3?'지금 좋아요':'저녁쯤 다시'))
                             : (rk>=4?'피크 지난 뒤':(rk===3?'한 시간 뒤':'지금'));
      const am=(s.age||'').match(/^(.*?)\s*([\d.]+%)$/);           // '60대 이상 26.1%' → 연령대 + 비율
      const ageBand=am?am[1]:(s.age||'—'), agePct=am?am[2]:'';
      det=`<div class="headline" style="color:${TXTC[s.s]}"><span>${MSG[mode][s.s]}</span></div>
      <div class="grid2">
        <div class="mcard acc" style="--c:${TXTC[s.s]}"><div class="lb">추정 인구</div>
          <div class="v num">${s.pop!=null?s.pop.toLocaleString():'—'}${s.pop!=null?'<small>명</small>':''}</div></div>
        <div class="mcard"><div class="lb">평시 대비</div><div class="v num">${s.diff??'—'}</div></div>
        <div class="mcard"><div class="lb">평시 피크</div><div class="v num">${s.peak??'—'}</div></div>
        <div class="mcard"><div class="lb">${mode==='E'?'가기 좋은 때':'조용한 방문'}</div><div class="v">${rec}</div></div>
      </div>
      ${wxRow}
      <div class="p-sec">24시간 흐름<span class="hint num">지금 ${s.nowIdx}시</span></div>
      <div class="bars">${bars}</div>
      <div class="bar-x num"><span>0시</span><span>6시</span><span>12시</span><span>18시</span><span>23시</span></div>
      <div class="kv">주 방문층 <b>${ageBand}</b>${agePct?` <span class="num">${agePct}</span>`:''}${s.sex?` · <b>${s.sex}</b>`:''}</div>
      ${camSec}${navSec}`;
    }
    const diffCell = s.diff ? `<span class="dv ${s.diff.startsWith('-')?'dd':'du'} num">${s.diff}</span>` : `<span class="dv num" style="font-weight:600">—</span>`;
    return `
    <div class="row ${sel===s.id?'sel':''} ${tint}" data-id="${s.id}">
      <span class="rk num">${String(i+1).padStart(2,'0')}</span>
      <div class="info"><b>${s.n}</b><span>${s.c}</span></div>
      <span class="pill ${PCLS[s.s]}">${s.s}</span>
      ${diffCell}
    </div>
    <div class="det">${det}</div>`;
  }).join('');
  document.querySelectorAll('.row').forEach(r=>r.addEventListener('click',()=>select(r.dataset.id,{fly:true})));
  document.querySelectorAll('.cambtn').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();openCam(CAMS[+b.dataset.ci],b.dataset.spot);}));
}

function renderStatChip(){
  const el=document.getElementById('statchip');
  const cnt={'여유':0,'보통':0,'약간 혼잡':0,'혼잡':0,'매우 혼잡':0};
  SPOTS.forEach(s=>{ if(cnt[s.s]!=null) cnt[s.s]++; });
  const busy=cnt['혼잡']+cnt['매우 혼잡'];
  const total=cnt['여유']+cnt['보통']+cnt['약간 혼잡']+busy;
  if(!total){ el.classList.remove('on'); return; }
  const item=(color,label,n)=>n?`<span><i style="background:${color}"></i>${label} <b>${n}</b></span>`:'';
  el.innerHTML=item(HEXC['여유'],'여유',cnt['여유'])+item(HEXC['보통'],'보통',cnt['보통'])
    +item(HEXC['약간 혼잡'],'약간',cnt['약간 혼잡'])+item(HEXC['혼잡'],'혼잡',busy);
  el.classList.add('on');
}

function renderBanner(){
  renderStatChip();
  const el=document.getElementById('banner');
  const live=SPOTS.filter(s=>(RANK[s.s]??0)>0);
  if(!live.length){ el.textContent='실시간 데이터를 불러오는 중입니다…'; return; }
  const busy=[...live].sort((a,b)=>RANK[b.s]-RANK[a.s]), calm=[...live].sort((a,b)=>RANK[a.s]-RANK[b.s]);
  const b2=busy[1]||busy[0], c2=calm[1]||calm[0];
  if(RANK[busy[0].s]===RANK[calm[0].s]){
    el.innerHTML = mode==='E'
      ? `지금 파주 전 지점이 <b style="color:${TXTC[busy[0].s]}">${busy[0].s}</b> 수준 — 줄 서는 곳이 없어요, 어디든 바로 입장`
      : `지금 파주 전 지점이 <b style="color:${TXTC[calm[0].s]}">${calm[0].s}</b> 수준 — 어디든 한적하게 다닐 수 있어요`;
    return;
  }
  el.innerHTML = mode==='E'
    ? `지금 뜨거운 곳 — <b style="color:${TXTC[busy[0].s]}">${busy[0].short}</b>, <b style="color:${TXTC[b2.s]}">${b2.short}</b> · 지도의 큰 원을 따라가세요`
    : `지금 한적한 곳 — <b style="color:${TXTC[calm[0].s]}">${calm[0].short}</b>, <b style="color:#55514a">${c2.short}</b> · <b style="color:${TXTC[busy[0].s]}">${busy[0].short}</b>${(RANK[busy[0].s]>=3)?'은 피하세요':' 정도가 제일 붐빕니다'}`;
}

// 정보창이 스크롤에 잘리지 않게 — 선택한 행을 맨 위로 올려 아래 공간을 정보창에 다 준다.
//   넓은 화면은 리스트가, 좁은 화면은 페이지가 스크롤되므로 둘 다 대응한다.
function revealDetail(id){
  const list=document.getElementById('list');
  const row=list&&list.querySelector(`.row[data-id="${id}"]`);
  if(!row) return;
  const head=list.querySelector('.list-head');
  const headH=head?head.offsetHeight:0;
  const go=()=>{
    if(list.scrollHeight>list.clientHeight+1){                 // 리스트 자체가 스크롤되는 경우
      const d=row.getBoundingClientRect().top-(list.getBoundingClientRect().top+headH);
      if(Math.abs(d)>1) list.scrollBy({top:d,behavior:'smooth'});
      return;
    }
    const mp=document.querySelector('.mapwrap');               // 좁은 화면: 지도가 위에 고정돼 있다
    const stick=(mp&&getComputedStyle(mp).position==='sticky')?mp.getBoundingClientRect().height:0;
    const d=row.getBoundingClientRect().top-stick-headH;
    if(Math.abs(d)>1) window.scrollBy({top:d,behavior:'smooth'});
  };
  requestAnimationFrame(go); setTimeout(go,80);              // 애니메이션이 억제된 환경 대비
}
function select(id,{fly}){
  const js=document.getElementById('spot-jump');
  if(sel===id){ sel=null; renderNodes(); renderList(); if(js) js.value='__all'; return; }
  sel=id; renderNodes(); renderList();
  if(js) js.value=id;
  const sp=SPOTS.find(x=>x.id===id);
  if(sp&&sp.api&&sp.spotId&&!sp.loaded&&!sp.loading) fetchDetail(sp);
  revealDetail(id);
  if(fly){
    const s=SPOTS.find(x=>x.id===id);
    const z=s.small?13:12;
    map.flyTo([s.lat,s.lng],Math.max(map.getZoom(),z),{duration:.6});
  }
}

// ── CCTV 모달 (HLS 실시간 재생)
const M_BODY=document.getElementById('m-body');
const M_PLACEHOLDER=M_BODY.innerHTML;
let camHls=null;
function stopStream(){
  if(camHls){ try{camHls.destroy();}catch(e){} camHls=null; }
  const v=document.getElementById('cv');
  if(v){ try{v.pause(); v.removeAttribute('src'); v.load();}catch(e){} }
}
function closeModal(){
  document.getElementById('modal-bg').classList.remove('open');
  stopStream();
  M_BODY.innerHTML=M_PLACEHOLDER;
}
function openCam(cam,sub){
  const name=(cam&&cam.n)||'';
  document.getElementById('m-title').textContent=name;
  document.getElementById('m-sub').textContent=sub||'실시간 도로 CCTV';
  stopStream();
  if(cam&&cam.url){
    M_BODY.innerHTML=`<video id="cv" autoplay muted playsinline controls style="width:100%;height:100%;object-fit:contain;background:#000"></video><div class="m-live"><i></i>LIVE</div><div class="m-src">${cam.src==='utic'?'경찰청(UTIC)':'국가교통정보센터'} 제공 · LIVE</div>`;
    const v=document.getElementById('cv');
    if(window.Hls&&Hls.isSupported()){ camHls=new Hls({maxBufferLength:15}); camHls.loadSource(cam.url); camHls.attachMedia(v); }
    else{ v.src=cam.url; }
  } else {
    M_BODY.innerHTML=M_PLACEHOLDER;
    const mc=document.getElementById('m-cam'); if(mc) mc.textContent=name;
  }
  document.getElementById('modal-bg').classList.add('open');
}
document.getElementById('m-x').onclick=closeModal;
document.getElementById('modal-bg').addEventListener('click',e=>{if(e.target.id==='modal-bg')closeModal();});

// ── 모드 탭
document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab'); if(!b) return;
  mode=b.dataset.m;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.m===mode));
  renderBanner(); renderNodes(); renderList();
});

// ── 실데이터 (Worker 프록시 /api/*)
function fmtDiff(v){ if(v==null||isNaN(v)) return null; const r=Math.round(v); return (r>=0?'+':'')+r+'%'; }
async function fetchDetail(s, rerender=true){
  if(!s.spotId||s.loading) return;
  s.loading=true;
  try{
    const r=await fetch('/api/spot/'+s.spotId); if(!r.ok) throw 0;
    const j=await r.json();
    const tr=j.trend||[];
    if(tr.length){
      const byH=new Array(24).fill(0);
      const max=Math.max(1,...tr.map(x=>Math.max(x.sum,x.avgSum)));
      tr.forEach(x=>{byH[x.h]=Math.round(x.sum/max*100);});
      s.t=byH;
      const last=tr[tr.length-1];
      s.nowIdx=last.h; s.pop=last.sum; s.diff=fmtDiff(last.vsAvg);
      let ph=null,pv=-1; tr.forEach(x=>{if(x.avgSum>pv){pv=x.avgSum;ph=x.h;}});
      s.peak=ph!=null?ph+'시':null;
    }
    if(j.age&&j.age.highestAge) s.age=j.age.highestAge+' '+j.age.highestRatio+'%';
    if(j.sex&&j.sex.highestGender) s.sex=(j.sex.highestGender==='여성'?'여 ':'남 ')+Math.max(j.sex.maleRatio,j.sex.femaleRatio).toFixed(0)+'%';
    s.loaded=true;
  }catch(e){}
  finally{ s.loading=false; if(rerender){ renderList(); if(sel===s.id) revealDetail(s.id); } }
}
async function loadAllDetails(){
  const targets=SPOTS.filter(s=>s.api&&s.spotId&&!s.loaded&&!s.loading);
  await Promise.all(targets.map(s=>fetchDetail(s,false)));
  renderList();
}
async function loadSummary(){
  try{
    const r=await fetch('/api/summary'); if(!r.ok) throw 0;
    const j=await r.json();
    (j.spots||[]).forEach(u=>{
      const s=SPOTS.find(x=>(x.apiName||x.n)===u.name);
      if(s){ if(u.label) s.s=u.label; s.spotId=u.id; if(u.lat!=null){s.lat=u.lat;s.lng=u.lng;} }
    });
    const d=new Date(j.asof);
    document.getElementById('asof').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+' 기준 · 5분 갱신';
    renderBanner(); renderNodes(); renderList();
    loadAllDetails(); loadWx();
  }catch(e){
    document.getElementById('asof').textContent='연결 오류 · 5분 뒤 재시도';
  }
}
async function loadVisits(){                                 // 방문자 수 — 같은 브라우저 세션은 1회만 집계
  try{
    let first=false;
    try{ first=!sessionStorage.getItem('np_v'); if(first) sessionStorage.setItem('np_v','1'); }catch(e){ first=true; }
    const r=await fetch(first?'/api/visit':'/api/stats',{method:first?'POST':'GET'});
    if(!r.ok) return;
    const j=await r.json();
    if(j.off||j.today==null) return;
    document.getElementById('visits').textContent=
      `오늘 ${j.today.toLocaleString()} / 전체 ${j.total.toLocaleString()}`;
  }catch(e){}
}

async function loadWx(){
  try{
    const pts=SPOTS.map(s=>`${s.lat.toFixed(4)},${s.lng.toFixed(4)}`).join(';');
    const r=await fetch('/api/weather?pts='+encodeURIComponent(pts)); if(!r.ok) return;
    const j=await r.json();
    (j.spots||[]).forEach((d,i)=>{ if(SPOTS[i]&&(d.w||d.air)) WX[SPOTS[i].id]=d; });   // 지점마다 제 좌표 값
    renderList();
  }catch(e){}
}

// 노선 표기 통일 — 원본이 '국도 77호선'·'국도77호선'·'국도77'로 제각각이라 '국도77호선'으로 맞춘다
function fixRoute(n){
  return (n||'').replace(/^\[(.+?)\]\s*/,(m,t)=>{
    let x=t.replace(/\s+/g,'').replace(/\([^)]*\)$/,'');   // 공백 제거 + 뒤 구간 괄호 제거
    if(/^국도\d+$/.test(x)) x+='호선';
    return `[${x}] `;
  }).replace(/^(\[[^\]]+\]\s*)\[[^\]]+\]\s*/,'$1');   // 이름 앞 [지역] 중복 표기 제거
}
async function loadIts(){
  if(!FEATURE_ITS) return;
  try{
    const [c,t]=await Promise.all([fetch('/api/cctv'),fetch('/api/traffic')]);
    if(c.ok){ const j=await c.json(); if(j.cams&&j.cams.length){
      CAMS=j.cams.filter(c2=>inPaju(c2.lat,c2.lng)).map(c2=>({...c2,n:fixRoute(c2.n)}));
      const nearSet=new Set();                               // 지도 핀 = 각 지점에서 4.5km 안 최근접 4개만 (지점 중심 표시)
      const R45=(4.5/111.32)**2;                             // 파주 시내엔 ITS 카메라가 없어 2.5km로는 절반이 빈다
      SPOTS.forEach(s=>nearestCams(s,4).filter(x=>x.d<=R45).forEach(x=>nearSet.add(x.i)));
      CAM_PINS=thinByRoute([...nearSet].map(i=>CAMS[i]));     // 같은 노선 연속분은 3개로 솎음
      renderCams(); renderList();
    } }
    if(t.ok){ const j=await t.json(); if(j.roads&&j.roads.length){ ROADS=j.roads; LINK_SPD=j.links||{}; ROAD_AVG=j.roadAvg||{};
      const d=new Date(j.asof); itsAsof=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
      trafficReady(); renderTraffic(); } }
  }catch(e){}
}
setInterval(loadSummary, 300000);
setInterval(loadIts, 300000);

// ── 초기화
document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.m===mode));
map.fitBounds(pajuBounds);
zoomClass();
renderBanner(); renderNodes(); renderCams(); renderList();
loadSummary();
loadIts();
fitRows();
loadVisits();
</script>
