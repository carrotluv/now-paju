name: 지금 파주 ITS 동기화

# 이 PC의 스케줄러가 하던 일(5분마다 국가교통정보센터 → data 브랜치)을 깃허브가 대신한다.
on:
  schedule:
    - cron: '*/5 * * * *'          # 5분마다 (깃허브 부하에 따라 몇 분 늦을 수 있음)
  workflow_dispatch:                # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: its-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 국가교통정보센터에서 수집
        env:
          ITS_KEY: ${{ secrets.ITS_KEY }}
        run: python scripts/its_sync_ci.py out/its.json

      - name: data 브랜치에 올리기 (항상 1커밋 유지)
        run: |
          set -e
          mkdir -p /tmp/pub
          if [ -f out/its.json ]; then
            cp out/its.json /tmp/pub/
            asof=$(python -c "import json;print(json.load(open('out/its.json',encoding='utf-8'))['asof'])")
          else
            asof="수집 실패"
          fi
          # 실패 진단서도 함께 올린다 — 관리자 권한 없이 원인을 확인하기 위함
          [ -f out/diag.txt ] && cp out/diag.txt /tmp/pub/
          cd /tmp/pub
          git init -q
          git config user.name "now-paju bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "its data $asof"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:data
          echo "data 브랜치 갱신: $asof"

      - name: 수집 성공 여부 판정
        run: |
          if [ ! -f out/its.json ]; then
            echo "::error::수집 실패 — data 브랜치의 diag.txt에 원인이 적혀 있습니다"
            cat out/diag.txt 2>/dev/null || true
            exit 1
          fi
          echo "정상"
